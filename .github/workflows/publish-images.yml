name: Publish images to ECR

# Runs on every push to main, including merged pull requests.
# Each service in the matrix below is built from services/<name>/Dockerfile and pushed to the
# ECR repository "<ECR_REPOSITORY_PREFIX>/<service>" with two tags: the commit SHA and "latest".
# To add a service, add its name to the matrix.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for AWS
    strategy:
      fail-fast: false
      matrix:
        service: [auth, catalog, interactions, upload, transcoder]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The build context is the repository root: services depend on libs/.
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
