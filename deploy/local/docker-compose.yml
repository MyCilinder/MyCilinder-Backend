# Local development stack (Architecture §4.5). Run from the repo root:
#
#   docker compose -f deploy/local/docker-compose.yml up -d
#
# Postgres stands in for Aurora behind RDS Proxy, Redis for ElastiCache. Credentials here
# are local-only defaults.

name: mycilinder

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mycilinder
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mycilinder"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates or updates the per-service login roles. Idempotent and runs on every `up`,
  # before any migration, so roles added later reach existing volumes without a wipe.
  # Every role exists before any migration runs, which lets the schema that owns a view
  # grant it to its readers (no cross-schema migration ordering).
  bootstrap-roles:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./bootstrap:/bootstrap:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "postgres", "-U", "postgres", "-d", "mycilinder", "-f", "/bootstrap/roles.sql"]
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot migration runners, one per schema. Each schema keeps its own version table,
  # so services can migrate independently (MAINT-09).
  migrate-audit:
    image: migrate/migrate:v4.18.3
    volumes:
      - ../../migrations/audit:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgres@postgres:5432/mycilinder?sslmode=disable&x-migrations-table=schema_migrations_audit
      - up
    depends_on:
      bootstrap-roles:
        condition: service_completed_successfully

  migrate-auth:
    image: migrate/migrate:v4.18.3
    volumes:
      - ../../migrations/auth:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgres@postgres:5432/mycilinder?sslmode=disable&x-migrations-table=schema_migrations_auth
      - up
    depends_on:
      bootstrap-roles:
        condition: service_completed_successfully

  migrate-catalog:
    image: migrate/migrate:v4.18.3
    volumes:
      - ../../migrations/catalog:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgres@postgres:5432/mycilinder?sslmode=disable&x-migrations-table=schema_migrations_catalog
      - up
    depends_on:
      bootstrap-roles:
        condition: service_completed_successfully

  migrate-interactions:
    image: migrate/migrate:v4.18.3
    volumes:
      - ../../migrations/interactions:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgres@postgres:5432/mycilinder?sslmode=disable&x-migrations-table=schema_migrations_interactions
      - up
    depends_on:
      bootstrap-roles:
        condition: service_completed_successfully

  migrate-upload:
    image: migrate/migrate:v4.18.3
    volumes:
      - ../../migrations/upload:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgres@postgres:5432/mycilinder?sslmode=disable&x-migrations-table=schema_migrations_upload
      - up
    depends_on:
      bootstrap-roles:
        condition: service_completed_successfully

  # Auth facade. Cognito settings come from services/auth/.env (copy .env.example);
  # the database and Redis addresses below override the 127.0.0.1 values in that file so
  # the container reaches the other Compose services.
  auth:
    build:
      context: ../..
      dockerfile: services/auth/Dockerfile
    env_file:
      - path: ../../services/auth/.env
        required: false
    environment:
      DATABASE_URL: postgres://auth_svc:auth_svc_local@postgres:5432/mycilinder?sslmode=disable
      REDIS_ADDR: redis:6379
    # Direct access for debugging. Clients use the gateway on :8000.
    ports:
      - "${AUTH_PORT:-8010}:8000"
    depends_on:
      migrate-audit:
        condition: service_completed_successfully
      migrate-auth:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Catalog service. Settings come from services/catalog/.env (copy .env.example); the
  # database and Redis addresses below override the 127.0.0.1 values in that file so the
  # container reaches the other Compose services. On ECS the same image gets RDS Proxy
  # and ElastiCache endpoints and uses the task role instead of a profile.
  catalog:
    build:
      context: ../..
      dockerfile: services/catalog/Dockerfile
    env_file:
      - path: ../../services/catalog/.env
        required: false
    # Run as your host user so the container can read the mounted ~/.aws files, which
    # are usually mode 600. Export LOCAL_UID/LOCAL_GID if yours are not 1000.
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      DATABASE_URL: postgres://catalog_svc:catalog_svc_local@postgres:5432/mycilinder?sslmode=disable
      DATABASE_READER_URL: postgres://catalog_svc:catalog_svc_local@postgres:5432/mycilinder?sslmode=disable
      REDIS_ADDR: redis:6379
      # AWS dev stack through your local profile (AWS_PROFILE in .env).
      HOME: /home/nonroot
    volumes:
      - ${HOME}/.aws:/home/nonroot/.aws:ro
      # CloudFront signing key for playback: services/catalog/secrets/cloudfront.pem,
      # used when CLOUDFRONT_PRIVATE_KEY_FILE=/run/secrets/catalog/cloudfront.pem.
      # The directory is in the repo (key files are gitignored), so the mount works
      # before any key exists.
      - ../../services/catalog/secrets:/run/secrets/catalog:ro
    # Direct access for debugging. Clients use the gateway on :8000.
    ports:
      - "${CATALOG_PORT:-8001}:8001"
    depends_on:
      migrate-catalog:
        condition: service_completed_successfully
      # Grants on auth.v_user_public, interactions.v_video_stats, and audit.audit_log.
      migrate-auth:
        condition: service_completed_successfully
      migrate-interactions:
        condition: service_completed_successfully
      migrate-audit:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Local API gateway: the single entry point for clients in development,
  # http://localhost:8000/api/v1 (Android emulator: http://10.0.2.2:8000/api/v1).
  # Routes by path like the ALB and adds dev-only CORS. See gateway/nginx.conf.
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${GATEWAY_PORT:-8000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Started together with the services, but not gated on their health: a service
    # that is down returns a 503 problem through the gateway.
    depends_on:
      auth:
        condition: service_started
      catalog:
        condition: service_started

volumes:
  pgdata:
