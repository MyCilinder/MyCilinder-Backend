# Local API gateway. Development only; never deployed.
#
# Stands in for CloudFront + API Gateway + the internal ALB, so the client uses a single
# base URL in development: http://localhost:8000/api/v1. Routing follows the ALB rules
# in Architecture §2.1, in the same priority order. Paths keep the /api/v1 prefix end to
# end, as in AWS.
#
# Two things here exist only locally:
#   - CORS. In AWS the client and the API share the CloudFront origin, so the services
#     never send CORS headers. Flutter web in development runs on another localhost
#     port, so the gateway adds them.
#   - A 503 problem when a service is not running (for example upload or interactions
#     before they are built), instead of nginx's HTML error page.
#
# This file is an nginx-image template: ${..._UPSTREAM} values are filled in from the
# gateway's environment at startup (docker-compose.yml sets the real services;
# docker-compose.mock.yml points them at the mock API, see mock-api/README.md).

# Docker's embedded DNS. Upstreams are resolved per request (proxy_pass with a
# variable), so the gateway starts even when some services are not running.
resolver 127.0.0.11 valid=10s ipv6=off;

# Allow any http://localhost:<port> or http://127.0.0.1:<port> origin, which covers
# `flutter run -d chrome` and its random port. Other origins get no CORS headers.
map $http_origin $cors_origin {
    default                                       "";
    "~^http://(localhost|127\.0\.0\.1)(:[0-9]+)?$" $http_origin;
}

server {
    listen 80;
    server_name _;

    # Uploads go straight to S3 with presigned URLs; API bodies are small.
    client_max_body_size 1m;

    add_header Access-Control-Allow-Origin   $cors_origin always;
    add_header Access-Control-Allow-Methods  "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers  "Authorization, Content-Type, Idempotency-Key, X-Session-Id, X-Correlation-Id" always;
    add_header Access-Control-Expose-Headers "X-Correlation-Id, Location, Retry-After, WWW-Authenticate" always;
    add_header Access-Control-Max-Age        600 always;
    add_header Vary                          Origin always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_connect_timeout 2s;
    proxy_read_timeout    30s;

    # CORS preflight: answered here, never forwarded.
    if ($request_method = OPTIONS) {
        return 204;
    }

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # --- ALB rules, in priority order (Architecture §2.1) ---

    # Auth facade: /auth/*, /me (exact; /me/videos belongs to Catalog).
    location ~ ^/api/v1/(auth/|me$) {
        set $upstream http://auth:8000;
        proxy_pass $upstream;
    }

    # Upload / Ingest: /uploads, /uploads/*.
    location ~ ^/api/v1/uploads(/|$) {
        set $upstream ${UPLOAD_UPSTREAM};
        proxy_pass $upstream;
    }

    # Interactions. Must come before Catalog, which also owns /videos/*.
    location ~ ^/api/v1/(videos/[^/]+/(stats|comments|like|views)$|reports$|ops/reports|ops/comments/) {
        set $upstream ${INTERACTIONS_UPSTREAM};
        proxy_pass $upstream;
    }

    # Catalog: /feed, /search, /creators/*, /videos/*, /me/videos, /ops/videos/*.
    location ~ ^/api/v1/(feed$|search$|creators/|videos/|me/videos$|ops/videos/) {
        set $upstream ${CATALOG_UPSTREAM};
        proxy_pass $upstream;
    }

    # --- Mock mode only (docker-compose.mock.yml) ---
    # Stand-ins for the S3 presigned PUT and for CloudFront media. Without the mock these
    # return the 503 problem below.
    location ^~ /mock-s3/ {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        set $upstream ${MOCK_UPSTREAM};
        proxy_pass $upstream;
    }
    location ^~ /media/ {
        set $upstream ${MOCK_UPSTREAM};
        proxy_pass $upstream;
    }

    # Anything else under /api/v1 matches no ALB rule.
    location / {
        default_type application/problem+json;
        return 404 '{"type":"/problems/not-found","title":"Resource not found","status":404,"detail":"no service routes this path"}';
    }

    # The upstream is not running or not reachable. Errors a service returns itself
    # (including its own 503s) pass through unchanged.
    error_page 502 504 = @unavailable;
    location @unavailable {
        default_type application/problem+json;
        return 503 '{"type":"/problems/unavailable","title":"Service unavailable","status":503,"detail":"the service for this path is not running locally"}';
    }
}
